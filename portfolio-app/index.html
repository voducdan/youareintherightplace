<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Vo Duc Dan — Senior Data Engineer</title>
    <meta
      name="description"
      content="Portfolio of Vo Duc Dan, Senior Data Engineer: ClickHouse, Airflow, Spark and dbt work rendered as an Airflow DAG."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <style>
      /* Boot styles only — the app's own tokens take over once main.js loads. */
      :root {
        --boot-bg: #f0f3f6;
        --boot-fg: #5f6b78;
        --boot-accent: #016ed4;
        --boot-line: #d3dbe3;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --boot-bg: #0d1117;
          --boot-fg: #8b98a6;
          --boot-accent: #148dfe;
          --boot-line: #2a3540;
        }
      }

      :root[data-theme='dark'] {
        --boot-bg: #0d1117;
        --boot-fg: #8b98a6;
        --boot-accent: #148dfe;
        --boot-line: #2a3540;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        z-index: 9999;
      }

      .loading-content {
        display: grid;
        gap: 14px;
        justify-items: center;
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--boot-fg);
      }

      .loading-bar {
        width: 160px;
        height: 2px;
        background: var(--boot-line);
        overflow: hidden;
      }

      .loading-progress {
        width: 40%;
        height: 100%;
        background: var(--boot-accent);
        animation: loading 1.4s ease-in-out infinite;
      }

      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-progress {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading-screen">
        <div class="loading-content">
          <span>Parsing DAG</span>
          <div class="loading-bar"><div class="loading-progress"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
