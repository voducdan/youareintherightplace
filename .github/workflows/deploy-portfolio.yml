name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-app/**'
      - '.github/workflows/deploy-portfolio.yml'
  pull_request:
    branches: [main]
    paths:
      - 'portfolio-app/**'
      - '.github/workflows/deploy-portfolio.yml'
  workflow_dispatch:

# The documented minimum for deploying Pages from Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portfolio-app/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-app
        run: npm ci

      - name: Build
        working-directory: portfolio-app
        run: npm run build

      # Pages serves this repo under /<repo-name>/. If vite's `base` does not
      # match, every asset 404s and the site loads as a blank page while the
      # workflow still reports success — which is exactly what happened when the
      # base was left at '/spec-driven/'. Fail loudly instead.
      - name: Verify asset paths match the Pages subpath
        working-directory: portfolio-app
        run: |
          set -euo pipefail
          expected="/${GITHUB_REPOSITORY#*/}/"
          test -f dist/index.html || { echo "::error::dist/index.html was not produced"; exit 1; }
          if ! grep -q "\"${expected}assets/" dist/index.html; then
            echo "::error::dist/index.html does not reference ${expected}assets/ — set base in portfolio-app/vite.config.js to '${expected}'"
            grep -oE '(src|href)="[^"]*"' dist/index.html || true
            exit 1
          fi
          echo "Asset paths correctly rooted at ${expected}"

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-app/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No continue-on-error here: a failed deployment must fail the workflow,
      # otherwise a broken site reports as a green run.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
